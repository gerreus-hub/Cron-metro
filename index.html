<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Cronómetro">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.png">
<title>Cronómetro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght=100;300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #000;
    --accent-light: #7b9ce8;
    --text: #fff;
    --btn-lap: #1e1e1e;
    --btn-start: #22305a;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: 'Roboto', sans-serif;
    color: var(--text);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .phone {
    width: 100%;
    max-width: 400px;
    height: 100%;
    max-height: 860px;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--bg);
    overflow: hidden;
  }

    .bg-glow {
    position: absolute;
    width: 150%; /* Lo hacemos más ancho que la pantalla */
    height: 120%; /* Y más alto */
    background: radial-gradient(circle at center, rgba(22,32,90,0.8) 0%, rgba(10,15,50,0.3) 50%, transparent 75%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
  }


  /* ===== DISPLAY ===== */
  .display-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 1;
    overflow: hidden;
  }

  /* --- View 1: Digital --- */
  .view-digital {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .timer-display {
    font-size: 68px;
    font-weight: 200;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    line-height: 1;
    text-align: center;
    user-select: none;
  }

  /* --- View 2: Dial --- */
  .view-dial {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .dial-wrapper {
    position: relative;
    width: 272px;
    height: 272px;
  }

  .dial-ticks-svg {
    position: absolute;
    top: -28px; left: -28px;
    width: calc(100% + 56px);
    height: calc(100% + 56px);
  }

  .dial-inner {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, #1e2130, #0b0d18);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .dial-time {
    font-size: 42px;
    font-weight: 200;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    user-select: none;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .needle-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* --- Laps (shared) --- */
  .laps-container {
    width: 100%;
    max-height: 150px;
    overflow-y: auto;
    padding: 0 28px;
    margin-top: 18px;
    scrollbar-width: none;
  }
  .laps-container::-webkit-scrollbar { display: none; }

  .lap-item {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-top: 1px solid rgba(255,255,255,0.07);
    font-size: 13px;
    font-weight: 300;
    animation: fadeIn 0.2s ease;
  }
  .lap-item:first-child { border-top: none; }
  .lap-num  { color: rgba(255,255,255,0.4); }
  .lap-time { color: rgba(255,255,255,0.85); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hidden { display: none !important; }

  /* ===== DOTS ===== */
  .dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 22px;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.22);
    cursor: pointer;
    transition: background 0.25s;
  }
  .dot.active { background: rgba(255,255,255,0.78); }

  /* ===== BUTTONS ===== */
  .buttons-row {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 0 32px 26px;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }

  .btn-circle {
    width: 90px; height: 90px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 400;
    cursor: pointer;
    border: none;
    outline: none;
    transition: transform 0.1s, filter 0.12s;
    user-select: none;
    letter-spacing: 0.3px;
  }
  .btn-circle:active { transform: scale(0.92); filter: brightness(0.78); }
  .btn-lap   { background: var(--btn-lap); color: rgba(255,255,255,0.52); }
  .btn-start { background: var(--btn-start); color: var(--accent-light); }
  .btn-start.running { background: #2e1818; color: #e07070; }

  /* ===== TAB BAR ===== */
  .tab-bar {
    background: rgba(26,26,36,0.92);
    border-radius: 40px;
    margin: 0 18px 18px;
    padding: 9px 18px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }
  .tab-btn {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    cursor: pointer;
    opacity: 0.42;
    transition: opacity 0.2s;
  }
  .tab-btn.active { background: rgba(255,255,255,0.11); opacity: 1; }
  .tab-btn svg {
    width: 22px; height: 22px;
    fill: none; stroke: #fff;
    stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round;
  }
  /* ===== MODAL SECRETO ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(66px);
  }
  .modal-box {
    background: #14172a;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 28px 24px 22px;
    width: 280px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .modal-title {
    font-size: 16px;
    font-weight: 400;
    color: rgba(255,255,255,0.85);
    text-align: center;
    letter-spacing: 0.5px;
  }
  .modal-row {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 10px;
  }
  .modal-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
  }
  .modal-field label {
    font-size: 11px;
    color: rgba(255,255,255,0.38);
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  .modal-field input {
    width: 90px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    color: #fff;
    font-size: 28px;
    font-weight: 200;
    font-family: 'Roboto', sans-serif;
    text-align: center;
    padding: 10px 6px;
    outline: none;
    -moz-appearance: textfield;
  }
  .modal-field input::-webkit-outer-spin-button,
  .modal-field input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .modal-field input:focus {
    border-color: rgba(107,140,225,0.6);
    background: rgba(107,140,225,0.08);
  }
  .modal-sep {
    font-size: 28px;
    font-weight: 200;
    color: rgba(255,255,255,0.4);
    padding-bottom: 10px;
  }
  .modal-buttons {
    display: flex;
    gap: 10px;
  }
  .modal-btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-family: 'Roboto', sans-serif;
    font-weight: 400;
    cursor: pointer;
    transition: filter 0.15s;
  }
  .modal-btn:active { filter: brightness(0.8); }
  .modal-btn.cancel { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.6); }
  .modal-btn.save   { background: #2a3a6e; color: #7b9ce8; }
</style>
</head>
<body>
<div class="phone">
  <div class="bg-glow"></div>

  <div class="display-area">

    <div class="view-digital" id="viewDigital">
      <div class="timer-display" id="timerDigital">00:00,00</div>
      <div class="laps-container" id="lapsDigital"></div>
    </div>

    <div class="view-dial hidden" id="viewDial">
      <div class="dial-wrapper">
        <svg class="dial-ticks-svg" viewBox="0 0 328 328" id="tickSvg"></svg>
        <div class="dial-inner">
          <svg class="needle-svg" viewBox="0 0 272 272" id="needleSvg">
            <g id="needleGroup" style="transform-origin:136px 136px">
              <line x1="136" y1="130" x2="136" y2="36"
                    stroke="#6b8ce1" stroke-width="2.2" stroke-linecap="round"/>
              <circle cx="136" cy="148" r="6" fill="#6b8ce1"/>
            </g>
          </svg>
          <div class="dial-time" id="timerDial">00:00,00</div>
        </div>
      </div>
      <div class="laps-container" id="lapsDial"></div>
    </div>

  </div>

  <div class="dots">
    <div class="dot active" onclick="switchView(0)"></div>
    <div class="dot"        onclick="switchView(1)"></div>
  </div>

  <div class="buttons-row">
    <button class="btn-circle btn-lap"   id="btnLap"   onclick="handleLap()">Vuelta</button>
    <button class="btn-circle btn-start" id="btnStart" onclick="handleStartStop()">Iniciar</button>
  </div>

  <div class="modal-overlay hidden" id="secretModal" onclick="closeSecretModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-title">Tiempo objetivo</div>
      <div class="modal-row">
        <div class="modal-field">
          <label>Segundos</label>
          <input type="number" id="inputSecs" min="0" max="3599" placeholder="4">
        </div>
        <div class="modal-sep">,</div>
        <div class="modal-field">
          <label>Centésimas</label>
          <input type="number" id="inputCs" min="0" max="99" placeholder="72">
        </div>
      </div>
      <div class="modal-buttons">
        <button class="modal-btn cancel" onclick="closeSecretModal()">Cancelar</button>
        <button class="modal-btn save"   onclick="saveSecretTime()">Guardar</button>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-btn">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/></svg>
    </div>
    <div class="tab-btn">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
    </div>
    <div class="tab-btn active">
      <svg viewBox="0 0 24 24" style="stroke:#8ab4f8"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 3h6"/><path d="M12 3v2"/></svg>
    </div>
    <div class="tab-btn">
      <svg viewBox="0 0 24 24"><path d="M5 3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/><path d="M12 8v4l3 3"/></svg>
    </div>
  </div>
</div>

<script>
// ===== SERVICE WORKER =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// ===== TICK MARKS =====
(function() {
  const svg = document.getElementById('tickSvg');
  const cx = 164, cy = 164, r = 154;
  for (let i = 0; i < 60; i++) {
    const angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
    const major = i % 5 === 0;
    const inner = r - (major ? 14 : 7);
    const x1 = cx + Math.cos(angle) * r;
    const y1 = cy + Math.sin(angle) * r;
    const x2 = cx + Math.cos(angle) * inner;
    const y2 = cy + Math.sin(angle) * inner;
    const l = document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1);
    l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke', major ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.2)');
    l.setAttribute('stroke-width', major ? '2.5' : '1.5');
    l.setAttribute('stroke-linecap','round');
    svg.appendChild(l);
  }
})();

// ===== STATE =====
let TARGET_CS = parseInt(localStorage.getItem('targetCS') || '472');
let running = false;
let startTime = null;
let elapsed = 0;
let rafId = null;
let laps = [];
let lapStartElapsed = 0;
let currentView = 0;

// ===== DOM =====
const btnStart     = document.getElementById('btnStart');
const btnLap       = document.getElementById('btnLap');
const timerDigital = document.getElementById('timerDigital');
const timerDial    = document.getElementById('timerDial');
const viewDigital  = document.getElementById('viewDigital');
const viewDial     = document.getElementById('viewDial');
const needleGroup  = document.getElementById('needleGroup');
const lapsDigital  = document.getElementById('lapsDigital');
const lapsDial     = document.getElementById('lapsDial');
const dots         = document.querySelectorAll('.dot');

// ===== VIEW SWITCH =====
function switchView(v) {
  currentView = v;
  viewDigital.classList.toggle('hidden', v !== 0);
  viewDial.classList.toggle('hidden',    v !== 1);
  dots.forEach((d, i) => d.classList.toggle('active', i === v));
}

// ===== FORMAT =====
function formatTime(cs) {
  const totalSec = Math.floor(cs / 100);
  const c = cs % 100;
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m > 0 ? String(m).padStart(2,'0') : '00'}:${String(s).padStart(2,'0')},${String(c).padStart(2,'0')}`;
}

// ===== NEEDLE =====
function updateNeedle(cs) {
  const secs = (cs / 100) % 60;
  const deg  = (secs / 60) * 360;
  needleGroup.style.transform = `rotate(${deg}deg)`;
}

// ===== TICK LOOP =====
function tick(now) {
  if (!running) return;
  const cs  = Math.floor((now - startTime) / 10) + elapsed;
  const str = formatTime(cs);
  timerDigital.textContent = str;
  timerDial.textContent    = str;
  updateNeedle(cs);
  rafId = requestAnimationFrame(tick);
}

// ===== CONTROLS =====
function handleStartStop() {
  if (!running) {
    running   = true;
    startTime = performance.now();
    btnStart.textContent = 'Detener';
    btnStart.classList.add('running');
    btnLap.textContent = 'Vuelta';
    btnLap.style.color = 'rgba(255,255,255,0.75)';
    rafId = requestAnimationFrame(tick);
  } else {
    running = false;
    cancelAnimationFrame(rafId);
    elapsed = TARGET_CS;
    const str = formatTime(TARGET_CS);
    timerDigital.textContent = str;
    timerDial.textContent = str;
    updateNeedle(TARGET_CS);
    btnStart.textContent = 'Iniciar';
    btnStart.classList.remove('running');
    btnLap.textContent = 'Restab.';
    btnLap.style.color = 'rgba(255,255,255,0.52)';
  }
}

// ===== TRIPLE TAP SECRET =====
let lapTapCount = 0;
let lapTapTimer = null;

function doReset() {
  elapsed = 0; laps = []; lapStartElapsed = 0;
  timerDigital.textContent = '00:00,00';
  timerDial.textContent    = '00:00,00';
  updateNeedle(0);
  btnLap.textContent = 'Vuelta';
  renderLaps();
}

function handleLap() {
  lapTapCount++;
  clearTimeout(lapTapTimer);

  // 3 taps: abrir modal secreto
  if (lapTapCount === 3) {
    lapTapCount = 0;
    openSecretModal();
    return;
  }

  // Esperar más taps durante 500ms
  lapTapTimer = setTimeout(() => {
    const count = lapTapCount;
    lapTapCount = 0;

    if (running) {
      // Registrar vuelta
      const cs      = Math.floor((performance.now() - startTime) / 10) + elapsed;
      const lapTime = cs - lapStartElapsed;
      lapStartElapsed = cs;
      laps.unshift({ n: laps.length + 1, t: formatTime(lapTime) });
      renderLaps();
    } else {
      // Reset
      doReset();
    }
  }, 500);
}

function openSecretModal() {
  const secs = Math.floor(TARGET_CS / 100);
  const cs   = TARGET_CS % 100;
  document.getElementById('inputSecs').value = secs;
  document.getElementById('inputCs').value   = String(cs).padStart(2,'0');
  document.getElementById('secretModal').classList.remove('hidden');
}

function saveSecretTime() {
  const s  = parseInt(document.getElementById('inputSecs').value) || 0;
  const cs = parseInt(document.getElementById('inputCs').value)   || 0;
  TARGET_CS = s * 100 + Math.min(cs, 99);
  localStorage.setItem('targetCS', TARGET_CS);
  document.getElementById('secretModal').classList.add('hidden');
}

function closeSecretModal() {
  document.getElementById('secretModal').classList.add('hidden');
}

function renderLaps() {
  const html = laps.map((lap, i) =>
    `<div class="lap-item">
       <span class="lap-num">Vuelta ${laps.length - i}</span>
       <span class="lap-time">${lap.t}</span>
     </div>`
  ).join('');
  lapsDigital.innerHTML = html;
  lapsDial.innerHTML    = html;
}
</script>
</body>
</html>
